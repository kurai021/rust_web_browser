# Dependency policy: plan/02-principles-constraints.md §2.3.
# Permissive by default; GPL/AGPL/LGPL only as a registered exception
# in plan/evidence/phase-0/licenses.md (requires anti-overengineering justification).

[advisories]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  # Copyleft exceptions (doc 02): linking them subjects the binary to copyleft.
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]
exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
