[package]
name = "web_api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["simd"]
simd = []

[dependencies]
net = { path = "../net", version = "0.1.0" }
dom_bindings = { path = "../dom_bindings", version = "0.1.0" }
url = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
futures = "0.3"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
cosmic-text = "0.12"
encoding_rs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
test_utils = { path = "../test_utils", version = "0.1.0" }

[lints]
workspace = true
