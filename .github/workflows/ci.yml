name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '43 2 * * *'

defaults:
  run:
    working-directory: browser

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: browser
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: cargo test --workspace --all-targets
        env:
          BROWSER_WPT_REPORT_DIR: ${{ github.workspace }}/browser/target/wpt-reports
          BROWSER_TEST262_REPORT_DIR: ${{ github.workspace }}/browser/target/test262-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-conformance-subsets
          path: |
            browser/target/wpt-reports
            browser/target/test262-reports
      - run: cargo test --workspace --no-default-features
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript differential oracle (tests only)
        run: cargo test -p js --test differential -- --ignored --exact representative_language_results_match_node
      - name: Modern JavaScript and bytecode differential oracle (tests only)
        run: cargo test -p js --test modern_differential -- --include-ignored
      - name: Five-tab startup and idle CPU acceptance (loopback only)
        run: |
          cargo build -p web_api -p shell --example demo_server --example phase9_probe
          target/debug/examples/demo_server 8099 > target/phase9-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:8099/browser/ > /dev/null; then break; fi
            sleep 0.1
          done
          target/debug/examples/phase9_probe http://127.0.0.1:8099/
      - run: sudo apt-get install -y mesa-vulkan-drivers libegl1
      - name: GPU and scalar display-list parity
        env:
          XDG_RUNTIME_DIR: /tmp
        run: cargo test -p paint --test backends gpu_and_software_render_the_same_display_list -- --ignored --exact

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: browser
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: browser
      - run: cargo check --workspace --locked

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: browser/Cargo.toml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  css-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: CSS parser and cascade fuzz smoke
        working-directory: browser/crates/css
        env:
          ASAN_OPTIONS: quarantine_size_mb=16
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=3600; else seconds=300; fi
          cargo +nightly fuzz run parse fuzz/seeds -- -max_total_time="$seconds" -max_len=4096 -timeout=3 -rss_limit_mb=1536

  image-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: cargo install cargo-fuzz --locked
      - name: Bounded raster and SVG decoder fuzz smoke
        working-directory: browser/crates/paint
        env:
          ASAN_OPTIONS: quarantine_size_mb=16
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=3600; else seconds=300; fi
          cargo +nightly fuzz run image_decode fuzz/seeds -- -max_total_time="$seconds" -max_len=4096 -timeout=3 -rss_limit_mb=1536

  html-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Streaming HTML parser fuzz smoke
        working-directory: browser/crates/html
        env:
          ASAN_OPTIONS: quarantine_size_mb=16
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=3600; else seconds=300; fi
          cargo +nightly fuzz run parse fuzz/seeds -- -max_total_time="$seconds" -max_len=8192 -timeout=3 -rss_limit_mb=1536

  js-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Bounded owned JavaScript parser, bytecode, jobs, modules and clone fuzz smoke
        working-directory: browser/crates/js
        env:
          ASAN_OPTIONS: quarantine_size_mb=16
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=3600; else seconds=300; fi
          cargo +nightly fuzz run parse_eval fuzz/seeds -- -max_total_time="$seconds" -max_len=8192 -timeout=3 -rss_limit_mb=1536

  layout-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: cargo install cargo-fuzz --locked
      - name: Advanced layout and finite geometry fuzz smoke
        working-directory: browser/crates/layout
        env:
          ASAN_OPTIONS: quarantine_size_mb=16
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=3600; else seconds=300; fi
          mkdir -p fuzz/corpus/layout
          cargo +nightly fuzz run layout fuzz/corpus/layout fuzz/seeds -- -max_total_time="$seconds" -max_len=8192 -timeout=5 -rss_limit_mb=1536

  web-api-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: cargo install cargo-fuzz --locked
      - name: Isolated page API, graph, observer and canvas fuzz smoke
        working-directory: browser/crates/web_api
        env:
          ASAN_OPTIONS: quarantine_size_mb=16
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=3600; else seconds=300; fi
          mkdir -p fuzz/corpus/page_apis
          cargo +nightly fuzz run page_apis fuzz/corpus/page_apis fuzz/seeds -- -max_total_time="$seconds" -max_len=8192 -timeout=10 -rss_limit_mb=1536
